{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <h2>Welcome back</h2>
  <p>Sign in to your DetectLab Triage account</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="analyst" required autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
      Sign in
    </button>
  </form>

  <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
    Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-orange); text-decoration: none; font-weight: 600;">Create one</a>
  </div>
</div>
{% endblock %}
